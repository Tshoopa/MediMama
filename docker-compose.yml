services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medimama-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  medimama:
    build: .
    container_name: medimama-api
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      INFERENCE_MODE: ${INFERENCE_MODE:-api}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      PORT: ${PORT:-8000}
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
